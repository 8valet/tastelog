name: Bug report
description: Report a reproducible problem in Tastelog.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, API keys, recovery links, private library data, or account screenshots.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the intended behavior.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the steps needed to reproduce this with synthetic data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Tastelog commit or version, browser, Node.js version, and deployment type.
    validations:
      required: true
